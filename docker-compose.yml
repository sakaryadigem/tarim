version: '3.8'

services:
  tarim-api:
    build: .
    container_name: tarim-api
    ports:
      - "4000:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=${DOCKER_DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-tarimpro}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root54}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - DEMO_MODE=${DEMO_MODE:-false}
      - API_PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  tarim-vite:
    build: .
    container_name: tarim-vite
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://tarim-api:3001
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./package.json:/app/package.json
    depends_on:
      tarim-api:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    external: true
